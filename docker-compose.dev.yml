services:
  app:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

    build:
      context: .
      target: dev-stage
    container_name: wish-mate
    hostname: wish-mate
    networks:
      - wishnet
    ports:
      - ${PORT}:5000
    env_file: ".env"
    command: air -c .air.toml
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - .:/app
#      - /app/tmp

  postgres:
    env_file: ".env"
    extends:
      service: postgres
      file: docker-compose.base.yml

  redis:
    env_file: ".env"
    extends:
      service: redis
      file: docker-compose.base.yml

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    env_file: ".env"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wishnet
    entrypoint: ["goose", "up"]
#  migrator:
#    build:
#      context: .
#      target: dev-stage
#    env_file: ".env"
#    depends_on:
#      - postgres
#    entrypoint: ["goose", "up"]
#    networks:
#      - wishnet

volumes:
  postgres-data:

networks:
  wishnet:
    driver: bridge