services:
  app:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
#    entrypoint: [ "sh", "-c", "until pg_isready -h postgres -U postgres; do sleep 1; done && goose up && ./your-app-binary" ]

    #      migrations:
#        condition: service_completed_successfully
    build:
      context: .
      target: dev-stage
    container_name: wish-mate
    hostname: wish-mate
    networks:
      - wishnet
    ports:
      - ${PORT}:5000
    env_file: ".env"
    command: air -c .air.toml
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - .:/app
#      - /app/tmp

  postgres:
    env_file: ".env"
    extends:
      service: postgres
      file: docker-compose.base.yml

  redis:
    env_file: ".env"
    extends:
      service: redis
      file: docker-compose.base.yml

  migrator:
    build:
      context: .
      target: dev-stage
    env_file: ".env"
    depends_on:
      - postgres
    entrypoint: ["goose", "up"]
    networks:
      - wishnet

#  migrations:
#    image: ghcr.io/kukymbr/goose-docker:3.24.1
#    env_file: ".env"
#    volumes:
#      - ./internal/database/migrations:/migrations
#    depends_on:
#      postgres:
#        condition: service_healthy
#    networks:
#      - wishnet


volumes:
  postgres-data:

networks:
  wishnet:
    driver: bridge