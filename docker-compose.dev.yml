services:
  app:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    build:
      context: .
      target: dev-stage
    container_name: wish-mate
    hostname: wish-mate
    networks:
      - wishnet
    ports:
      - ${PORT}:5000
    env_file: ".env"
    command: air -c .air.toml
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - .:/app
#      - /app/tmp

  postgres:
    env_file: ".env"
    extends:
      service: postgres
      file: docker-compose.base.yml

  redis:
    env_file: ".env"
    extends:
      service: redis
      file: docker-compose.base.yml

  migrations:
    image: ghcr.io/kukymbr/goose-docker:3.24.1
    env_file: ".env"
    volumes:
      - ./internal/database/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres-data:

networks:
  wishnet:
    driver: bridge